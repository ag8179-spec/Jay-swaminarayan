    <meta charset="UTF-8">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f4f1ea;

            /* FLEX 1: the whole page is a flex container, stacked top to bottom */
            display: flex;
            flex-direction: column;   /* main axis runs downward */
            align-items: center;      /* cross axis: centre everything horizontally */
            gap: 20px;
        }

        /* FLEX 2: photo and text sit side by side */
        .profile {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;          /* drops to the next line on small screens */
            justify-content: center;  /* main axis: centre horizontally */
            align-items: center;      /* cross axis: centre vertically */
            gap: 30px;
            max-width: 800px;
        }

        .profile img {
            flex-shrink: 0;           /* photo never gets squeezed */
            width: 280px;
            max-width: 100%;
            border-radius: 12px;
        }

        .profile .text {
            flex-grow: 1;             /* text takes the leftover space */
            flex-basis: 250px;        /* but starts from 250px wide */
        }

        /* FLEX 3: row of buttons, spread evenly */
        .buttons {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 15px;
            width: 100%;
            max-width: 800px;
        }

        .buttons button {
            flex-grow: 1;             /* both buttons share the row equally */
            padding: 14px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        /* FLEX 4: the answer box, centred both ways */
        .answer {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80px;
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 12px;
        }

        /* Media query: on phones, stack the profile in a column */
        @media (max-width: 600px) {
            .profile {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>

        <div class="text">
            <h2>Ganshaym Maharaj, Gurukul Bangalore</h2>
            <h2 id="greeting"></h2>
        </div>
    </div>

    <div class="buttons">
        <button id="myButton">Click me!</button>
        <button id="fortuneButton">Show me a quality of Gurukul</button>
    </div>

    <div class="answer">
        <h2 id="fortune"></h2>
    </div>

<script>
// Greeting button
const button = document.getElementById("myButton");
const greeting = document.getElementById("greeting");

button.addEventListener("click", function () {
    const name = prompt("Hi! What is your name?");
    if (name) {
        greeting.textContent = "Hello, " + name + "!";
    }
});

// Fortune button
const values = [
    "Courage",
    "Honesty",
    "Seva (selfless service)",
    "Discipline",
    "Humility",
    "Respect for teachers and elders",
    "Gratitude"
];

const fortuneButton = document.getElementById("fortuneButton");
const fortune = document.getElementById("fortune");

fortuneButton.addEventListener("click", function () {
    const index = Math.floor(Math.random() * values.length);
    fortune.textContent = values[index];
});
</script>
